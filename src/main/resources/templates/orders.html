<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{fragments :: head('Orders')}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header th:replace="~{fragments :: header}">
    </header>
    <main id="main" class="container">
      <div th:replace="~{fragments :: flash}">
      </div>
      <div class="page-heading">
        <div>
          <div class="eyebrow">ORDER TRACKING</div>
          <h1 th:text="${isStaff ? 'Orders' : 'My orders'}">
          </h1>
          <p>View order details and current status.</p>
        </div>
        <a th:if="${isStaff}" class="button primary" th:href="@{/staff/customers}">Create customer order +</a>
      </div>
      <form class="filter-form" th:action="@{/orders}" method="get">
        <label for="status">Order status</label>
        <select name="status" id="status">
          <option value="">All statuses</option>
          <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${status == s}">
          </option>
        </select>
        <button class="button secondary" type="submit">Filter</button>
      </form>
      <section class="panel flush">
        <div th:replace="~{fragments :: ordersTable(${orders})}">
        </div>
      </section>
    </main>
    <footer th:replace="~{fragments :: footer}">
    </footer>
    <script th:src="@{/js/app.js}" defer>
    </script>
  </body>
</html>
