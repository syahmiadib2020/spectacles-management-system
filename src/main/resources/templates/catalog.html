<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{fragments :: head('Catalogue')}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header th:replace="~{fragments :: header}">
    </header>
    <main id="main" class="container">
      <div th:replace="~{fragments :: flash}">
      </div>
      <div class="page-heading">
        <div>
          <div class="eyebrow">PRODUCT CATALOGUE</div>
          <h1 th:text="${type == 'FRAME' ? 'Frame page' : 'Lens page'}">
          </h1>
          <p th:text="${type == 'FRAME' ? 'View available frames and stock.' : 'View available lenses and stock.'}">
          </p>
        </div>
        <a th:if="${isStaff}" class="button primary" th:href="@{/staff/products/new(type=${type})}" th:text="${type == 'FRAME' ? 'Add frame +' : 'Add lens +'}">
        </a>
      </div>
      <div class="catalog-tools">
        <div class="tabs">
          <a th:href="@{/catalog(type='FRAME')}" th:classappend="${type == 'FRAME' ? 'active' : ''}">Frames</a>
          <a th:href="@{/catalog(type='LENS')}" th:classappend="${type == 'LENS' ? 'active' : ''}">Lenses</a>
        </div>
        <form th:action="@{/catalog}" method="get" class="search-form">
          <input type="hidden" name="type" th:value="${type}">
          <label for="q" class="sr-only">Search catalogue</label>
          <input type="search" id="q" name="q" th:value="${q}" placeholder="Search model, brand or ID" maxlength="100">
          <button class="button secondary" type="submit">Search</button>
        </form>
      </div>
      <p class="results-count">
        <span th:text="${#lists.size(products)}">
        </span> models <span th:if="${!#strings.isEmpty(q)}">matching “<span th:text="${q}">
          </span>” · <a th:href="@{/catalog(type=${type})}">Clear search</a>
        </span>
      </p>
      <section class="panel flush">
        <div class="table-wrap">
          <table class="product-table">
            <thead>
              <tr>
                <th>Model name</th>
                <th>ID</th>
                <th th:text="${type == 'FRAME' ? 'Shape / colour' : 'Prescription / astigmatism'}">
                </th>
                <th>Quantity</th>
                <th>Price (RM)</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${products}">
                <td>
                  <a class="product-cell" th:href="@{/catalog/{id}(id=${p.id})}">
                    <img th:src="${p.type == 'FRAME'} ? @{/images/frame.svg} : @{/images/lens.svg}" th:alt="${p.type == 'FRAME' ? 'Illustration of an eyeglass frame' : 'Illustration of a lens'}" width="100" height="72">
                    <span>
                      <strong th:text="${p.model}">
                      </strong>
                      <small th:text="${p.brand}">
                      </small>
                    </span>
                  </a>
                </td>
                <td th:text="${#numbers.formatInteger(p.id,4)}">
                </td>
                <td>
                  <span th:text="${p.type == 'FRAME' ? p.frameShape : p.prescription}">
                  </span>
                  <small th:text="${p.type == 'FRAME' ? p.frameColour : 'Astigmatism: ' + p.astigmatism}">
                  </small>
                </td>
                <td>
                  <span class="stock-count" th:classappend="${p.quantity <= 5 ? 'low' : ''}" th:text="${p.quantity}">
                  </span>
                </td>
                <td class="money" th:text="${#numbers.formatDecimal(p.price,1,'COMMA',2,'POINT')}">
                </td>
                <td>
                  <div class="table-actions">
                    <a class="table-link" th:href="@{/catalog/{id}(id=${p.id})}">View</a>
                    <a th:if="${isStaff}" class="table-link" th:href="@{/staff/products/{id}/edit(id=${p.id})}">Edit</a>
                    <form th:if="${isStaff}" th:action="@{/staff/products/{id}/delete(id=${p.id})}" method="post" data-confirm="Remove this product from the catalogue? Existing orders will be kept.">
                      <input type="hidden" name="version" th:value="${p.version}">
                      <button type="submit" class="text-button danger">Delete</button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="6" class="empty">No models found. Try a different search.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <p class="quiet-note">Product illustrations are representative. Model details and stock are shown in the table.</p>
    </main>
    <footer th:replace="~{fragments :: footer}">
    </footer>
    <script th:src="@{/js/app.js}" defer>
    </script>
  </body>
</html>
