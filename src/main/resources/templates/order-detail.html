<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{fragments :: head('Order details')}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header th:replace="~{fragments :: header}">
    </header>
    <main id="main" class="container">
      <div th:replace="~{fragments :: flash}">
      </div>
      <a class="back-link" th:href="@{/orders}">← Back to orders</a>
      <div class="page-heading top-space">
        <div>
          <div class="eyebrow">ORDER DETAILS</div>
          <h1 th:text="${'ME-' + #numbers.formatInteger(order.id,4)}">
          </h1>
          <p th:text="${#temporals.format(order.createdAt.atZone(T(java.time.ZoneId).of('Asia/Kuala_Lumpur')), 'dd MMM yyyy, HH:mm')}">
          </p>
        </div>
        <div class="button-row">
          <button type="button" class="button secondary" data-print>Print order</button>
          <a th:if="${isStaff and order.status != 'Completed' and order.status != 'Cancelled'}" class="button primary" th:href="@{/staff/orders/{id}/edit(id=${order.id})}">Update order</a>
        </div>
      </div>
      <div class="detail-grid">
        <section class="panel">
          <div class="section-heading">
            <h2>Order summary</h2>
            <span class="badge" th:classappend="${#strings.toLowerCase(#strings.replace(order.status,' ','-'))}" th:text="${order.status}">
            </span>
          </div>
          <dl class="details">
            <div>
              <dt>Frame</dt>
              <dd th:text="${order.frameName}">
              </dd>
            </div>
            <div>
              <dt>Lens</dt>
              <dd th:text="${order.lensName}">
              </dd>
            </div>
            <div>
              <dt>Quantity</dt>
              <dd th:text="${order.quantity}">
              </dd>
            </div>
            <div>
              <dt>Unit price</dt>
              <dd th:text="${'RM ' + #numbers.formatDecimal(order.unitPrice,1,'COMMA',2,'POINT')}">
              </dd>
            </div>
          </dl>
          <div class="order-total">
            <span>Total</span>
            <strong th:text="${'RM ' + #numbers.formatDecimal(order.total,1,'COMMA',2,'POINT')}">
            </strong>
          </div>
        </section>
        <section class="panel">
          <h2>Customer &amp; delivery</h2>
          <dl class="details">
            <div>
              <dt>Customer</dt>
              <dd>
                <a th:if="${isStaff}" th:href="@{/staff/customers/{id}(id=${customer.id})}" th:text="${customer.name}">
                </a>
                <span th:unless="${isStaff}" th:text="${customer.name}">
                </span>
              </dd>
            </div>
            <div>
              <dt>Delivery method</dt>
              <dd th:text="${order.delivery == 'OUTLET' ? 'Collect at ' + order.outlet + ' outlet' : 'Deliver to customer'}">
              </dd>
            </div>
            <div>
              <dt>Delivery address</dt>
              <dd th:text="${order.shippingAddress}">
              </dd>
            </div>
            <div>
              <dt>Eye power at time of order</dt>
              <dd th:text="${'Left: ' + order.leftPower + ' D · Right: ' + order.rightPower + ' D'}">
              </dd>
            </div>
            <div>
              <dt>Prescription / astigmatism</dt>
              <dd th:text="${(#strings.isEmpty(order.prescription) ? 'Not specified' : order.prescription) + ' / ' + (#strings.isEmpty(order.astigmatism) ? 'Not specified' : order.astigmatism)}">
              </dd>
            </div>
          </dl>
        </section>
      </div>
      <section class="panel top-space">
        <h2>Order progress</h2>
        <ol class="timeline">
          <li th:each="event : ${history}">
            <span class="timeline-dot">
            </span>
            <strong th:text="${event.status}">
            </strong>
            <small th:text="${#temporals.format(event.createdAt.atZone(T(java.time.ZoneId).of('Asia/Kuala_Lumpur')), 'dd MMM yyyy, HH:mm')}">
            </small>
          </li>
        </ol>
      </section>
    </main>
    <footer th:replace="~{fragments :: footer}">
    </footer>
    <script th:src="@{/js/app.js}" defer>
    </script>
  </body>
</html>
